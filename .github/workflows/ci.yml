name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Core project
        run: dotnet restore Engine/Genesis.Engine.Core/Genesis.Engine.Core.csproj

      - name: Build Core project
        run: dotnet build Engine/Genesis.Engine.Core/Genesis.Engine.Core.csproj --no-restore -c Release

      - name: Test
        run: dotnet test Engine/Genesis.Engine.Tests/Genesis.Engine.Tests.csproj --no-build -c Release --verbosity normal
